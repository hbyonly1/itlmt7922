name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source privacy and firmware integrity
        run: python3 scripts/check-release.py
      - name: Run host tests with ASan and UBSan
        env:
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash tests/run_all.sh

  macos-build:
    needs: host-tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out pinned MacKernelSDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build/MacKernelSDK
          persist-credentials: false
      - name: Verify SDK pin
        run: test "$(git -C build/MacKernelSDK rev-parse HEAD)" = 3f750085caa17ec3a7880f11c11bf4f48cd6a164
      - name: Test menu application connection and login state
        run: sh tests/run_app_tests.sh
      - name: Build x86_64 kext and menu application
        run: bash scripts/build.sh
      - name: Package and check release contents
        run: |
          python3 scripts/package.py
          python3 scripts/check-release.py --dist dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: itlmt7922-experimental-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
